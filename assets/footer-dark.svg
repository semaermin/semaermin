<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<style>
  .wave { animation: wave 8s ease-in-out infinite alternate; }
  @keyframes wave { to { transform: translateX(-60px); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#818CF8"/><stop offset="1" stop-color="#E879F9"/></linearGradient>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#1E1B4B"/></linearGradient><clipPath id="clip"><rect width="1200" height="150" rx="24"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="1200" height="150" fill="url(#bg)"/>
  <path class="wave" d="M0 112 C150 82 300 142 450 112 C600 82 750 142 900 112 C1050 82 1200 142 1350 112 V150 H0 Z" fill="#818CF8" opacity=".16"/>
  <path class="wave" style="animation-duration:11s" d="M-60 124 C90 100 240 148 390 124 C540 100 690 148 840 124 C990 100 1140 148 1290 124 V150 H-60 Z" fill="#E879F9" opacity=".14"/>
</g>
<rect x=".5" y=".5" width="1199" height="149" rx="24" fill="none" stroke="#312E81"/>
<text x="600.0" y="64" text-anchor="middle" font-size="26" font-weight="800" fill="#F8FAFC">Let's build something <tspan fill="url(#ac)">useful</tspan> together</text>
<text x="600.0" y="96" text-anchor="middle" font-size="16" fill="#CBD5E1">Open to collaborations on ERP, integrations and internal tools</text>
</svg>
