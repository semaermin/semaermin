<rect x="740" y="48" width="400" height="224" rx="14" fill="#111827" stroke="#1F2937"/>
<circle cx="764" cy="72" r="6" fill="#FF5F57"/><circle cx="784" cy="72" r="6" fill="#FEBC2E"/><circle cx="804" cy="72" r="6" fill="#28C840"/>
