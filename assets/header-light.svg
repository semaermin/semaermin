<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<style>
  .blob { animation: drift 9s ease-in-out infinite alternate; }
  .blob2 { animation: drift 11s ease-in-out infinite alternate-reverse; }
  .cursor { animation: blink 1.1s steps(1) infinite; }
  @media (prefers-reduced-motion: reduce) { .blob, .blob2, .cursor { animation: none; } }
  @keyframes drift { to { transform: translate(-30px, 18px); } }
  @keyframes blink { 50% { opacity: 0; } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F5F3FF"/><stop offset="1" stop-color="#EEF2FF"/></linearGradient>
  <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#D946EF"/></linearGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#6366F1" opacity=".22"/></pattern>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
  <clipPath id="clip"><rect width="1200" height="320" rx="24"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#dots)"/>
  <circle class="blob" cx="1060" cy="40" r="150" fill="#6366F1" opacity=".35" filter="url(#blur)"/>
  <circle class="blob2" cx="700" cy="330" r="130" fill="#D946EF" opacity=".25" filter="url(#blur)"/>
</g>
<rect x=".5" y=".5" width="1199" height="319" rx="24" fill="none" stroke="#E0E7FF"/>

<text x="64" y="88" font-size="15" font-weight="700" letter-spacing="3" fill="#6366F1">FULL STACK DEVELOPER · ISTANBUL</text>
<text x="62" y="156" font-size="60" font-weight="800" fill="#0F172A">Hi, I'm <tspan fill="url(#ac)">Sema</tspan></text>
<text x="64" y="200" font-size="20" fill="#475569">I build ERP interfaces, operation panels and</text>
<text x="64" y="228" font-size="20" fill="#475569">integrations with Laravel, React and Next.js.</text>
